# Default values for mychart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pullPolicy: Always

imagePullSecrets:
  - name: github-regcred
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8761

istio:
  enabled: false

ingress:
  enabled: true
  ingressClass: nginx
  hosts:
    - host: discovery-service.sonam.cloud
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sonam.cloud
      hosts:
        - "*.sonam.cloud"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 768Mi

nodeSelector: {}

tolerations: []

affinity: {}

envs:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25"
  - name: SERVER_PORT
    value: 8761
  - name: HOSTNAME
    value: discovery-service.sonam.cloud
  - name: DEFAULT_ZONE
    value: https://discovery-service.sonam.cloud/eureka

health:
  liveness:
    path: /actuator/health
    port: 8761
    initialDelaySeconds: 20
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: /actuator/health
    port: 8761
    initialDelaySeconds: 20
    periodSeconds: 5
    failureThreshold: 5

secretFiles:
  - file: eureka-discovery
    keys:
      - key: user
        name: EUREKA_USER
      - key: password
        name: EUREKA_PASSWORD
